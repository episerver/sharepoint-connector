name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  packages: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET Framework 4.6.1 targeting pack
        shell: pwsh
        run: |
          choco install netfx-4.6.1-devpack -y --no-progress

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1.3

      - name: Restore NuGet packages
        run: nuget restore EPiServer.ConnectForSharePoint.sln

      - name: Build solution
        run: msbuild EPiServer.ConnectForSharePoint.sln /t:Build /p:Configuration=Debug /p:Platform="Any CPU" /p:RunPostBuildEvent=false

      - name: Run tests
        run: vstest.console.exe "EPIServer.ConnectForSharePoint.Test\bin\Debug\EPiServer.ConnectForSharePoint.Test.dll"

      - name: Read version from AssemblyVersionAuto.cs
        id: version
        shell: pwsh
        run: |
          $match = (Select-String -Path AssemblyVersionAuto.cs -Pattern 'AssemblyInformationalVersion\("(.+)"\)').Matches[0]
          $version = $match.Groups[1].Value
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Base version: $version"

      # --- PR builds: pre-release package ---
      - name: Create pre-release NuGet package
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $prerelease = "${{ steps.version.outputs.VERSION }}-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          echo "PRERELEASE_VERSION=$prerelease" >> $env:GITHUB_OUTPUT
          echo "Pre-release version: $prerelease"
          nuget pack MSBuild\EPiServer.ConnectForSharePoint.nuspec -Version $prerelease -OutputDirectory Deployment
        id: prerelease

      - name: Publish pre-release to GitHub Packages
        if: github.event_name == 'pull_request'
        run: nuget push Deployment\EPiServer.ConnectForSharePoint.${{ steps.prerelease.outputs.PRERELEASE_VERSION }}.nupkg -Source https://nuget.pkg.github.com/episerver/index.json -ApiKey ${{ secrets.GITHUB_TOKEN }}

      # --- Master builds: release package ---
      - name: Create NuGet package
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: nuget pack MSBuild\EPiServer.ConnectForSharePoint.nuspec -Version ${{ steps.version.outputs.VERSION }} -OutputDirectory Deployment

      - name: Check if version already exists on GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $source = "https://nuget.pkg.github.com/episerver/index.json"
          $result = nuget list EPiServer.ConnectForSharePoint -Source $source -AllVersions 2>&1
          if ($result -match "${{ steps.version.outputs.VERSION }}") {
            Write-Error "Version ${{ steps.version.outputs.VERSION }} already exists on GitHub Packages. Bump the version in AssemblyVersionAuto.cs before merging."
            exit 1
          }
          echo "Version ${{ steps.version.outputs.VERSION }} is available."

      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: nuget push Deployment\EPiServer.ConnectForSharePoint.${{ steps.version.outputs.VERSION }}.nupkg -Source https://nuget.pkg.github.com/episerver/index.json -ApiKey ${{ secrets.GITHUB_TOKEN }}
