name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET Framework 4.6.1 targeting pack
        shell: pwsh
        run: |
          choco install netfx-4.6.1-devpack -y --no-progress

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1.3

      - name: Restore NuGet packages
        run: nuget restore EPiServer.ConnectForSharePoint.sln

      - name: Build solution
        run: msbuild EPiServer.ConnectForSharePoint.sln /t:Build /p:Configuration=Debug /p:Platform="Any CPU" /p:RunPostBuildEvent=false

      - name: Run tests
        run: vstest.console.exe "EPIServer.ConnectForSharePoint.Test\bin\Debug\EPiServer.ConnectForSharePoint.Test.dll"
