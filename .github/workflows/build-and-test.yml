name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET Framework 4.6.1 targeting pack
        shell: pwsh
        run: |
          choco install netfx-4.6.1-devpack -y --no-progress

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1.3

      - name: Restore NuGet packages
        run: nuget restore EPiServer.ConnectForSharePoint.sln

      - name: Build solution
        run: msbuild EPiServer.ConnectForSharePoint.sln /t:Build /p:Configuration=Debug /p:Platform="Any CPU" /p:RunPostBuildEvent=false

      - name: Run tests
        run: vstest.console.exe "EPIServer.ConnectForSharePoint.Test\bin\Debug\EPiServer.ConnectForSharePoint.Test.dll"

      - name: Stage deployment directory
        shell: pwsh
        run: |
          # Copy DLLs to Deployment/lib
          New-Item -ItemType Directory -Path Deployment\lib -Force | Out-Null
          Copy-Item "EPIServer.ConnectForSharePoint\bin\Debug\EPiServer.ConnectForSharePoint.dll" -Destination "Deployment\lib\"
          Copy-Item "EPIServer.ConnectForSharePoint.Messaging\bin\Debug\EPiServer.ConnectForSharePoint.Messaging.dll" -Destination "Deployment\lib\"

          # Copy module.config to Deployment/content/modules/_protected/EPiServer.ConnectForSharePoint
          $modulePath = "Deployment\content\modules\_protected\EPiServer.ConnectForSharePoint"
          New-Item -ItemType Directory -Path $modulePath -Force | Out-Null
          Copy-Item "EPIServer.ConnectForSharePoint\module.config" -Destination "$modulePath\"

          # Create EPiServer.ConnectForSharePoint.zip containing module client resources
          $zipStagingDir = "Deployment\_zipstaging"
          New-Item -ItemType Directory -Path "$zipStagingDir\ClientResources\Images" -Force | Out-Null
          New-Item -ItemType Directory -Path "$zipStagingDir\EmbeddedLangFiles" -Force | Out-Null
          New-Item -ItemType Directory -Path "$zipStagingDir\Web" -Force | Out-Null

          Copy-Item "EPIServer.ConnectForSharePoint\ClientResources\Images\DefaultThumbnail.png" -Destination "$zipStagingDir\ClientResources\Images\"
          Copy-Item "EPIServer.ConnectForSharePoint\EmbeddedLangFiles\EPiServer.SharePoint_EN.xml" -Destination "$zipStagingDir\EmbeddedLangFiles\"
          Copy-Item "EPIServer.ConnectForSharePoint\Web\SharePointConfiguration.aspx" -Destination "$zipStagingDir\Web\"

          $zipPath = "$modulePath\EPiServer.ConnectForSharePoint.zip"
          Compress-Archive -Path "$zipStagingDir\*" -DestinationPath $zipPath -Force

          # Clean up staging directory
          Remove-Item -Path $zipStagingDir -Recurse -Force

          # Verify layout
          Write-Host "=== Deployment directory layout ==="
          Get-ChildItem -Path Deployment -Recurse -File | ForEach-Object {
            Write-Host "  $($_.FullName.Substring((Get-Location).Path.Length + 1))  ($($_.Length) bytes)"
          }

      - name: Read version from AssemblyVersionAuto.cs
        id: version
        shell: pwsh
        run: |
          $match = (Select-String -Path AssemblyVersionAuto.cs -Pattern 'AssemblyInformationalVersion\("(.+)"\)').Matches[0]
          $version = $match.Groups[1].Value
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Create pre-release NuGet package
        if: github.event_name == 'pull_request'
        run: nuget pack MSBuild\EPiServer.ConnectForSharePoint.nuspec -Version ${{ steps.version.outputs.VERSION }}.${{ github.run_number }}-pre -BasePath Deployment -OutputDirectory Deployment

      - name: Create release NuGet package
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: nuget pack MSBuild\EPiServer.ConnectForSharePoint.nuspec -Version ${{ steps.version.outputs.VERSION }} -BasePath Deployment -OutputDirectory Deployment

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: Deployment/*.nupkg
